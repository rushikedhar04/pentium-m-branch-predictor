<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}</style></head><body>
<svg id="s" width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<style>.box{fill:#eef4fc;stroke:#2a78d6;stroke-width:1.5}.g{fill:#e8f7f1;stroke:#1baf7a;stroke-width:1.5}.n{fill:#f6f6f4;stroke:#888;stroke-width:1.2}
.t{font-size:13px;fill:#111}.s{font-size:11.5px;fill:#444}.h{font-size:14px;font-weight:bold;fill:#111}.l{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}</style>
<!-- inputs -->
<rect class="n" x="20" y="40" width="150" height="44" rx="6"/><text class="h" x="95" y="60" text-anchor="middle">Branch address</text><text class="s" x="95" y="76" text-anchor="middle">IP (32 bits)</text>
<rect class="n" x="20" y="250" width="150" height="58" rx="6"/><text class="h" x="95" y="272" text-anchor="middle">GHR (15 bits)</text><text class="s" x="95" y="290" text-anchor="middle">outcomes of the last</text><text class="s" x="95" y="303" text-anchor="middle">15 conditional branches</text>
<!-- xor -->
<circle cx="250" cy="200" r="20" fill="#fff" stroke="#333" stroke-width="1.4"/><text x="250" y="206" text-anchor="middle" font-size="18">⊕</text>
<path class="l" d="M95,84 L95,200 L228,200"/><text class="s" x="104" y="190">IP[14:0]</text>
<path class="l" d="M170,279 L250,279 L250,222"/>
<!-- hash -->
<rect class="n" x="300" y="176" width="120" height="48" rx="6"/><text class="h" x="360" y="197" text-anchor="middle">HASH</text><text class="s" x="360" y="214" text-anchor="middle">15 bits</text>
<path class="l" d="M270,200 L298,200"/>
<!-- bimodal -->
<rect class="box" x="300" y="30" width="190" height="66" rx="6"/><text class="h" x="395" y="54" text-anchor="middle">Bimodal table</text><text class="s" x="395" y="72" text-anchor="middle">4096 × 2-bit counters</text><text class="s" x="395" y="87" text-anchor="middle">index = IP[11:0]</text>
<path class="l" d="M170,62 L298,62"/><text class="s" x="190" y="55">IP[11:0]</text>
<!-- global -->
<rect class="g" x="470" y="150" width="210" height="110" rx="6"/><text class="h" x="575" y="174" text-anchor="middle">Global predictor</text>
<text class="s" x="575" y="193" text-anchor="middle">512 sets × 4 ways</text><text class="s" x="575" y="209" text-anchor="middle">entry: valid | tag (6) | 2-bit ctr</text><text class="s" x="575" y="225" text-anchor="middle">true-LRU replacement</text><text class="s" x="575" y="244" text-anchor="middle">set = HASH[14:6], tag = HASH[5:0]</text>
<path class="l" d="M420,200 L468,200"/>
<!-- mux -->
<path d="M760,60 L800,80 L800,240 L760,260 Z" fill="#fff" stroke="#333" stroke-width="1.4"/>
<text class="s" x="780" y="105" text-anchor="middle">0</text><text class="s" x="780" y="215" text-anchor="middle">1</text>
<path class="l" d="M490,62 L620,62 L620,100 L758,100"/><text class="s" x="560" y="55">bimodal prediction</text>
<path class="l" d="M680,210 L758,210"/><text class="s" x="719" y="203" text-anchor="middle">global pred.</text>
<path class="l" d="M640,260 L640,300 L780,300 L780,252"/><text class="s" x="650" y="318">global hit (tag match)</text>
<path class="l" d="M800,160 L880,160"/><text class="h" x="806" y="148">Outcome</text><text class="h" x="806" y="180">prediction</text>
<!-- update note -->
<rect x="20" y="345" width="860" height="60" rx="6" fill="#fafaf8" stroke="#ddd"/>
<text class="t" x="34" y="368"><tspan font-weight="bold">Update:</tspan> bimodal counter always trained · global hit → train entry, make MRU · global miss and bimodal wrong → allocate LRU way</text>
<text class="t" x="34" y="390">(counter set weakly toward the outcome) · GHR ← (GHR &lt;&lt; 1) | outcome</text>
</svg></body></html>
